
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sonic Hub</title>
  <meta name="referrer" content="no-referrer"/>
  <meta name="robots" content="noindex, nofollow"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f8f9fa; --surface: #ffffff; --border: #e3e6ea;
      --text: #0f1111; --muted: #565959;
      --orange: #ff6b00; --orange-d: #cc5500; --orange-l: #fff3e8;
      --blue: #1a73e8; --blue-l: #e8f0fe;
      --green: #0a7e07; --green-l: #e6f4ea;
      --radius: 10px;
    }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); }

    header { background: #0f1111; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,0.4); }
    .header-inner { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; align-items: center; gap: 14px; height: 58px; }
    .logo { display: flex; align-items: center; gap: 9px; text-decoration: none; flex-shrink: 0; }
    .logo-icon { width: 36px; height: 36px; border-radius: 8px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #1a1a1a; }
    .logo-icon img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; }
    .logo-text { color: #fff; font-size: 19px; font-weight: 800; }
    .logo-text span { color: var(--orange); }
    .header-btns { margin-left: auto; display: flex; gap: 8px; }
    .hbtn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 6px; font-size: 13px; font-weight: 600; border: none; cursor: pointer; transition: opacity 0.15s, transform 0.15s; white-space: nowrap; }
    .hbtn:hover { opacity: 0.88; transform: translateY(-1px); }
    .hbtn img { width: 16px; height: 16px; object-fit: contain; }
    .btn-tg  { background: #229ED9; color: #fff; }
    .btn-ig  { background: linear-gradient(135deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: #fff; }
    .btn-own { background: var(--orange); color: #fff; }

    nav { background: #232f3e; }
    .nav-inner { max-width: 1100px; margin: 0 auto; padding: 0 16px; display: flex; gap: 2px; overflow-x: auto; align-items: center; }
    .nav-inner a { color: #fff; font-size: 13px; font-weight: 500; text-decoration: none; padding: 8px 13px; white-space: nowrap; border-radius: 4px; transition: background 0.15s; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
    .nav-inner a:hover { background: rgba(255,255,255,0.12); }
    .nav-inner img { width: 14px; height: 14px; object-fit: contain; }

    .hero { background: linear-gradient(110deg, #0f1111 0%, #1a2332 100%); padding: 36px 16px 32px; text-align: center; }
    .hero h1 { font-size: clamp(22px,4.5vw,38px); font-weight: 800; color: #fff; line-height: 1.2; }
    .hero h1 span { color: var(--orange); }
    .hero p { color: #8a9bae; font-size: 14px; margin-top: 8px; }

    .cards-wrap { max-width: 1100px; margin: 32px auto; padding: 0 16px; }
    .cards-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(280px,1fr)); gap: 16px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); color: inherit; display: flex; flex-direction: column; transition: box-shadow 0.2s, transform 0.2s; box-shadow: 0 1px 4px rgba(0,0,0,0.08); cursor: pointer; }
    .card:hover { box-shadow: 0 4px 16px rgba(0,0,0,0.13); transform: translateY(-2px); }
    .card-top { padding: 18px 18px 10px; display: flex; align-items: center; gap: 12px; }
    .card-ico { width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .ico-o { background: var(--orange-l); } .ico-b { background: var(--blue-l); } .ico-g { background: var(--green-l); }
    .card-name { font-size: 16px; font-weight: 700; }
    .card-sub  { font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 3px; }
    .sub-o { color: var(--orange); } .sub-b { color: var(--blue); } .sub-g { color: var(--green); }
    .card-foot { padding: 12px 18px 16px; margin-top: auto; }
    .card-btn { display: inline-block; padding: 8px 18px; border-radius: 6px; font-size: 13px; font-weight: 600; color: #fff; border: none; cursor: pointer; }
    .cbtn-o { background: var(--orange); } .cbtn-b { background: var(--blue); } .cbtn-g { background: var(--green); }

    footer { background: #0f1111; color: #6a7070; text-align: center; padding: 18px 16px; font-size: 12px; margin-top: 40px; }
    footer a { color: #f0c040; text-decoration: none; margin: 0 8px; cursor: pointer; }

    .float-tg { position: fixed; bottom: 22px; right: 18px; z-index: 999; display: flex; align-items: center; gap: 7px; background: #229ED9; color: #fff; padding: 10px 18px; border-radius: 50px; font-size: 13px; font-weight: 700; border: none; cursor: pointer; box-shadow: 0 4px 18px rgba(34,158,217,0.45); transition: all 0.2s; }
    .float-tg:hover { background: #1a7db0; transform: scale(1.04); }
    .float-tg img { width: 16px; height: 16px; object-fit: contain; }
    .dot { width: 7px; height: 7px; background: #fff; border-radius: 50%; animation: pp 1.6s infinite; }
    @keyframes pp { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:.4;transform:scale(.7)} }

    .card, .card-btn, .nav-inner a { -webkit-user-select: none; user-select: none; }

    @media(max-width:600px){
      .hbtn span { display: none; }
      .hero h1 { font-size: 22px; }
    }
  </style>
</head>
<body>

</body>
</html>
